name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "adopt"
          cache: maven

      - name: Install gettext
        run: sudo apt-get install -y gettext

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Rename artifact with version
        run: cp target/NeoCommander-jar-with-dependencies.jar target/NeoCommander-${{ steps.version.outputs.VERSION }}-jar-with-dependencies.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: target/NeoCommander-${{ steps.version.outputs.VERSION }}-jar-with-dependencies.jar
